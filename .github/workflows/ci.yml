name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Testabdeckung (Mindestwerte)
        run: npm run coverage
      - name: Audit (keine hohen Befunde in Produktionsabhängigkeiten)
        run: npm audit --omit=dev --audit-level=high
      - name: Worker bündeln (ohne Deploy)
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --outdir ../../.wrangler/dry
        env:
          WRANGLER_SEND_METRICS: "false"
